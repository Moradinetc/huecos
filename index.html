<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Huecos · etcétera accesorios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ef; --bg2:#ffffff; --ink:#2b2235; --dim:#8c8496; --line:#e7e1d8;
    --morado:#5b2a86; --morado-soft:#efe7f5; --dorado:#b9985a; --dorado-soft:#f3ead9;
    --verde:#5f8a5f; --verde-soft:#e6efe3; --amar:#c9962f; --amar-soft:#f6eed5; --rojo:#b5544e; --rojo-soft:#f7e4e2;
    --azul:#3a6ea5; --azul-soft:#e2ecf5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;min-height:100vh}
  .topbar{background:#1c1620;color:#fff;text-align:center;font-size:12px;letter-spacing:.14em;padding:9px;font-weight:300}
  .wrap{max-width:min(1980px,98vw);margin:0 auto;padding:30px 24px 70px}
  .head{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:16px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo img{height:48px;width:auto;display:block}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;line-height:1}
  .brand .sub{font-size:11px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;margin-top:4px}
  .badge{font-size:11px;color:var(--morado);background:var(--morado-soft);border-radius:999px;padding:7px 15px;display:inline-flex;align-items:center;gap:8px;letter-spacing:.08em;font-weight:500}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--morado)}
  .tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{font-family:'Fraunces',serif;font-size:17px;font-weight:500;color:var(--dim);padding:10px 22px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.activo{color:var(--morado);border-bottom-color:var(--morado);font-weight:600}

  .ctrl{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:15px 18px;margin-bottom:14px}
  .ctrl .et{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:11px}
  .fila{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
  .fg{display:flex;flex-direction:column;gap:5px}
  .fg label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
  .fg input[type=date],.fg input[type=number],.fg select{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--morado);font-weight:600;background:var(--bg2)}
  .fg input[type=number]{width:120px}
  .fg select{min-width:230px;cursor:pointer}
  .fg input[type=date]:focus,.fg select:focus{outline:none;border-color:var(--morado)}
  .dias-info{font-size:13px;color:var(--dim);padding-bottom:9px}
  .dias-info b{color:var(--morado)}
  .solo-venta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;user-select:none;padding-bottom:9px}
  .solo-venta input{width:16px;height:16px;accent-color:var(--morado);cursor:pointer}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:grab;user-select:none;transition:all .15s;color:var(--ink)}
  .chip:hover{border-color:var(--morado);color:var(--morado)}
  .chip:active{cursor:grabbing}
  .chip.disabled{opacity:.32;cursor:default}
  .chip.disabled:hover{border-color:var(--line);color:var(--ink)}
  .dropzone{margin-top:12px;border:1.5px dashed var(--line);border-radius:8px;padding:12px;min-height:56px;transition:all .15s}
  .dropzone.dragover{border-color:var(--morado);background:var(--morado-soft)}
  .dz-tit{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
  .niveles-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .vacio{font-size:13px;color:var(--dim);font-style:italic}
  .nivel{position:relative;display:flex;align-items:center;gap:7px;background:var(--morado-soft);border:1px solid #d9c4ec;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--morado);cursor:default}
  .nivel .conteo{background:var(--morado);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;font-weight:600}
  .nivel .caret{cursor:pointer;font-size:11px;opacity:.8}
  .nivel .caret.activo{transform:rotate(180deg)}
  .nivel .x{cursor:pointer;font-size:11px;opacity:.7;margin-left:2px}
  .nivel .x:hover{opacity:1;color:var(--rojo)}
  .dropdown{position:absolute;top:calc(100% + 8px);left:0;z-index:50;background:var(--bg2);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px rgba(43,34,53,.16);width:300px;max-height:360px;display:flex;flex-direction:column;overflow:hidden}
  .dropdown .dd-head{padding:10px 12px;border-bottom:1px solid var(--line)}
  .dropdown .dd-head input{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--ink)}
  .dropdown .dd-head input:focus{outline:none;border-color:var(--morado)}
  .dropdown .dd-acciones{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}
  .dropdown .dd-acciones a{color:var(--morado);cursor:pointer;font-weight:500}
  .dropdown .dd-acciones a:hover{text-decoration:underline}
  .dropdown .dd-list{overflow-y:auto;padding:6px 4px}
  .dd-item{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;cursor:pointer;border-radius:5px}
  .dd-item:hover{background:var(--bg)}
  .dd-item input{accent-color:var(--morado)}
  .dd-item span:first-of-type{flex:1}
  .dd-item .ex{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}

  .resumen{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:16px}
  .resumen .r{display:flex;flex-direction:column;gap:3px}
  .resumen .r .l{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim)}
  .resumen .r .v{font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1;color:var(--morado)}
  .resumen .r.dor .v{color:var(--dorado)} .resumen .r.ver .v{color:var(--verde)} .resumen .r.azu .v{color:var(--azul)}

  .barra{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
  .barra .buscar{flex:1;min-width:280px}
  .barra input{width:100%;font-size:15px;padding:11px 15px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;color:var(--ink);background:var(--bg2)}
  .barra input:focus{outline:none;border-color:var(--morado)}
  .btn-volver{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-volver:hover{border-color:var(--morado);color:var(--morado)}

  .panel{background:var(--bg2);border:1px solid var(--line);border-radius:6px}
  #ant-tabla{max-height:70vh;overflow:auto;border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1100px}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{position:sticky;top:0;z-index:10;background:var(--bg2);box-shadow:inset 0 -1px 0 var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;vertical-align:bottom}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  th.orden{cursor:pointer;user-select:none}
  th.orden:hover{color:var(--morado)}
  th.orden .ar{color:var(--morado);font-size:10px;margin-left:3px}
  .rowline:hover{background:var(--bg)}
  .col-exist{background:var(--dorado-soft)}
  td.foto-thumb-cell{width:50px}
  .foto-thumb{width:38px;height:38px;object-fit:cover;border-radius:5px;cursor:zoom-in;background:var(--bg2)}
  .v-vendido{color:var(--azul);font-weight:600;background:var(--azul-soft)}
  .util{font-weight:700;color:var(--verde)} .util.neg{color:var(--rojo)}
  .cob{font-weight:600;color:var(--azul)} .cob.inf{color:var(--rojo)} .cob.cero{color:var(--dim);font-weight:400}
  .antig{font-weight:600} .antig.viejo{color:var(--rojo)} .antig.medio{color:var(--amar)}
  .dsm{font-weight:600} .dsm.alto{color:var(--rojo)} .dsm.cero{color:var(--dim);font-weight:400}
  .pill-desc{font-size:11px;background:var(--morado-soft);color:var(--morado);border-radius:999px;padding:2px 8px;font-weight:600}
  .nota{text-align:center;color:var(--dim);padding:14px;font-style:italic}
  .empty{text-align:center;color:var(--dim);padding:46px;font-size:15px;font-family:'Fraunces',serif;font-style:italic}

  .foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;letter-spacing:.05em}
  .state{display:flex;align-items:center;justify-content:center;min-height:34vh;flex-direction:column;gap:16px;text-align:center;padding:20px}
  .state .big{font-family:'Fraunces',serif;font-size:24px;font-weight:600}
  .spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--morado);border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .errbox{background:#fbeeee;border:1px solid #e0a0a0;color:#9a4a4a;padding:16px 20px;border-radius:6px;font-size:13px;max-width:560px;line-height:1.6;text-align:left}

  /* ----- Lista de selección ----- */
  .add-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:3px;gap:3px;font-size:9.5px;font-weight:600;color:var(--morado);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
  .add-btn:hover{background:#fff;border-color:var(--morado)}
  .add-btn.in{color:#fff;background:var(--morado);border-color:var(--morado)}
  .exist-sub{font-size:9px;color:var(--dim);font-weight:400;margin-top:2px;white-space:nowrap}
  #sel-fab{position:fixed;right:18px;bottom:18px;z-index:120;background:var(--morado);color:#fff;border:none;border-radius:30px;padding:11px 18px;font-weight:600;font-size:13px;box-shadow:0 6px 20px rgba(91,42,134,.35);cursor:pointer;display:none;align-items:center;gap:8px}
  #sel-fab .badge{background:var(--dorado);color:#3a2a14;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:700}
  #sel-panel{display:none;margin-top:20px}
  #sel-panel.open{display:block}
  .sel-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
  .sel-head h3{font-family:'Fraunces',serif;font-size:18px;margin:0;color:var(--ink)}
  .sel-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .btn{font-size:12px;font-weight:600;border-radius:8px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
  .btn:hover{filter:brightness(.97)}
  .btn.pdf{background:var(--morado);color:#fff;border-color:var(--morado)}
  .btn.xls{background:var(--verde);color:#fff;border-color:var(--verde)}
  .btn.clr{color:var(--rojo)}
  #sel-tabla{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg2);max-height:62vh}
  #sel-tabla table{width:100%;border-collapse:collapse;font-size:12px}
  #sel-tabla th,#sel-tabla td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
  #sel-tabla th{position:sticky;top:0;background:var(--bg2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);z-index:2}
  #sel-tabla td.num,#sel-tabla th.num{text-align:right}
  .desc-in{width:78px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px}
  .qx{color:var(--rojo);cursor:pointer;font-weight:700;border:none;background:none;font-size:16px;line-height:1}
  .mg-pos{color:var(--verde);font-weight:600}.mg-neg{color:var(--rojo);font-weight:600}
  .sel-empty{padding:22px;text-align:center;color:var(--dim);font-size:13px}
  @media print{ body.printing *{visibility:hidden} body.printing #sel-print,body.printing #sel-print *{visibility:visible} body.printing #sel-print{position:absolute;left:0;top:0;width:100%} }

  /* ----- Papel de trabajo · Huecos ----- */
  .hk-tag{background:var(--dorado);color:#fff;border-radius:999px;font-size:9px;padding:1px 7px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:default}
  .hk-tag.off{background:transparent;color:var(--dorado);border:1px solid var(--dorado);cursor:pointer;opacity:.75}
  .hk-tag.off:hover{opacity:1;background:var(--dorado-soft)}
  .tgl{position:relative;display:inline-block;width:42px;height:22px;background:var(--line);border-radius:999px;cursor:pointer;transition:background .15s;vertical-align:middle;flex:none}
  .tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .tgl.on{background:var(--rojo)}
  .tgl.on::after{left:22px}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
  .segb{border:none;background:var(--bg2);color:var(--dim);font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;cursor:pointer}
  .segb.on{background:var(--morado);color:#fff}
  .sku-bar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .sku-box{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg2);min-height:42px;cursor:text}
  .sku-box:focus-within{border-color:var(--morado)}
  .sku-box input{flex:1;min-width:160px;border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink);padding:3px 2px}
  .sku-chip{display:inline-flex;align-items:center;gap:6px;background:var(--morado);color:#fff;border-radius:6px;padding:3px 4px 3px 9px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .sku-chip .x{cursor:pointer;opacity:.75;font-size:11px;padding:0 4px;border-radius:4px}
  .sku-chip .x:hover{opacity:1;background:rgba(255,255,255,.25)}
  .sku-cnt{font-size:12px;color:var(--morado);font-weight:600;white-space:nowrap}
  #hk-pg-bar{margin-top:2px}
  .hk-pg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 4px 2px}
  .pg-btn{border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;min-width:34px;height:34px;padding:0 9px;border-radius:7px;cursor:pointer}
  .pg-btn:hover:not(:disabled){border-color:var(--morado);color:var(--morado)}
  .pg-btn.on{background:var(--morado);color:#fff;border-color:var(--morado)}
  .pg-btn:disabled{opacity:.4;cursor:default}
  .pg-dots{color:var(--dim);padding:0 2px}
  .pg-info{font-size:12px;color:var(--dim);margin-left:6px}
  .pg-all{margin-left:auto;border:1.5px solid var(--dorado);background:transparent;color:var(--dorado);font-family:inherit;font-size:12px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer}
  .pg-all:hover{background:var(--dorado-soft)}
  .fxc{position:sticky;background:var(--bg2)}
  #hk-tabla tbody .fxc,#hk-tabla tfoot .fxc{z-index:9}
  #hk-tabla thead .fxc{z-index:14}
  #hk-tabla thead tr.hk-h2 th.fxc{white-space:normal;vertical-align:bottom}
  .fx1{left:0;width:180px;min-width:180px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .fx2{left:180px;width:104px;min-width:104px;max-width:104px;white-space:nowrap}
  .fx3{left:284px;width:92px;min-width:92px;max-width:92px}
  .fx4{left:376px;width:92px;min-width:92px;max-width:92px}
  .fx5{left:468px;width:90px;min-width:90px;max-width:90px;border-right:2px solid var(--line)}
  #hk-tabla tbody tr:nth-child(even) td.fxc{background:#faf8f4}
  #hk-tabla tbody tr:hover td.fxc{background:var(--bg)}
  #hk-tabla tfoot td.fxc{background:#efe9df}
  .hk-click{cursor:pointer}
  .hk-click:hover{box-shadow:inset 0 0 0 2px var(--morado);border-radius:3px}

  /* scroll ágil en Por SKU: el navegador omite filas fuera de pantalla */
  #hk-tabla.sku-mode tbody tr{content-visibility:auto;contain-intrinsic-size:auto 37px}
  #hk-tabla.sku-mode table{table-layout:auto}
  #hk-tabla.sku-mode tbody td.num{min-width:60px}
  #hk-tabla{will-change:scroll-position}
  .sem-barra{display:inline-block;width:70px;height:7px;background:var(--line);border-radius:999px;overflow:hidden;vertical-align:middle;margin-right:6px}
  .sem-barra-in{height:100%;background:var(--verde)}
  .resumen .r.rojo .l,.resumen .r.rojo .v{color:var(--rojo)}
  .hk-cont{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
  .hk-chip{font-size:12px;color:var(--ink);background:var(--bg);border-radius:6px;padding:3px 9px}
  .hk-chip.rojo{background:var(--rojo-soft);color:var(--rojo)}
  .hk-barra{flex-basis:100%;height:8px;background:var(--line);border-radius:999px;overflow:hidden;display:flex;margin-top:4px}
  .hk-barra-sku{background:var(--verde);height:100%}
  .hk-barra-sim{background:var(--morado);height:100%}
  .hk-sim-wrap{border-top:2px solid var(--dorado);max-height:34vh;overflow:auto}
  .hk-sim-head{position:sticky;top:0;background:var(--bg2);padding:11px 16px;font-family:"Fraunces",serif;font-size:15px;font-weight:600;color:var(--morado);z-index:3}
  .hk-sim-note{font-family:inherit;font-size:12px;font-weight:400;color:var(--dim)}
  .hk-sim-body table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
  .hk-sim-body th,.hk-sim-body td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}
  .hk-sim-body th{position:sticky;top:44px;background:var(--bg2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);z-index:2}
  .hk-sim-body th.num,.hk-sim-body td.num{text-align:right}
  #hk-modal-ov{position:fixed;inset:0;background:rgba(28,22,32,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
  #hk-modal{background:var(--bg2);border-radius:10px;max-width:min(1200px,96vw);width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
  .hk-m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .hk-m-tit{font-family:"Fraunces",serif;font-size:19px;font-weight:600;color:var(--morado)}
  .hk-m-sub{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.6}
  .hk-m-x{border:none;background:none;font-size:18px;cursor:pointer;color:var(--dim);padding:4px 8px;flex:none}
  .hk-m-x:hover{color:var(--rojo)}
  .hk-m-body{overflow:auto;padding:0;max-height:42vh}
  .hk-m-body table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
  .hk-m-body th,.hk-m-body td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}
  .hk-m-body th{position:sticky;top:0;background:var(--bg2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);z-index:2}
  .hk-m-body th.hk-ord:hover{color:var(--morado)}
  .hk-m-body th.hk-ord-on{color:var(--morado)}
  .hk-m-body th.num,.hk-m-body td.num{text-align:right}
  .hk-m-body tfoot td{position:sticky;bottom:0;background:#efe9df;border-top:2px solid var(--dorado)}
  #hk-tabla{max-height:74vh;overflow:auto;border-radius:6px}
  #hk-tabla table{border-collapse:separate;border-spacing:0;min-width:0;width:auto}
  #hk-tabla th,#hk-tabla td{border-bottom:1px solid var(--line);padding:7px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  #hk-tabla thead th{position:sticky;background:var(--bg2);z-index:11;font-weight:600;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  #hk-tabla thead tr.hk-h1 th{top:0;text-align:center;font-family:'Fraunces',serif;font-size:13.5px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;border-bottom:2px solid var(--dorado)}
  #hk-tabla thead tr.hk-h2 th{top:35px;box-shadow:inset 0 -1px 0 var(--line)}
  #hk-tabla th.num,#hk-tabla td.num{text-align:right}
  .hk-fix{position:sticky;left:0;background:var(--bg2);z-index:12;border-right:1px solid var(--line)}
  #hk-tabla thead .hk-fix{z-index:13}
  .hk-grp{border-left:2px solid var(--line)}
  .hk-tot{background:var(--dorado-soft)}
  .hk-neg{background:var(--rojo-soft);color:var(--rojo);font-weight:700}
  .hk-cero{color:var(--dim)}
  .c-b{font-weight:600}
  .c-bb{font-weight:700}
  .c-dim{color:var(--dim)}
  .c-sku{color:var(--dim);font-weight:600}
  .c-cd{font-weight:600;color:var(--dorado)}
  .c-tr{font-weight:600;color:var(--azul)}
  .c-rc{font-weight:600;color:var(--verde)}
  #hk-tabla tbody tr:nth-child(even) td{background:#faf8f4}
  #hk-tabla tbody tr:nth-child(even) td.hk-fix{background:#faf8f4}
  #hk-tabla tbody tr:nth-child(even) td.hk-tot{background:#f0e7d3}
  #hk-tabla tbody tr:nth-child(even) td.hk-neg{background:var(--rojo-soft)}
  #hk-tabla tbody tr:hover td{background:var(--bg)}
  #hk-tabla tbody tr:hover td.hk-neg{background:#f3d6d3}
  #hk-tabla tfoot td{position:sticky;bottom:0;background:#efe9df;font-weight:700;border-top:2px solid var(--dorado);z-index:11}
  #hk-tabla tfoot td.hk-fix{z-index:12;background:#efe9df}
  #hk-tabla tfoot td.hk-neg{background:#f0d4d1}

<script>
var params=new URLSearchParams(window.location.search);
var TOKEN=params.get('token')||'';
function num(n){ return Number(Math.round(n)||0).toLocaleString('es-MX'); }
function money(n){ n=Number(n)||0; return (n<0?'-$':'$')+Number(Math.round(Math.abs(n))).toLocaleString('es-MX'); }
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function parseFecha(s){ var d=String(s).split('-'); return new Date(+d[0],+d[1]-1,+d[2]); }
function fmtFecha(dt){ return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); }
function diffDias(a,b){ return Math.round((parseFecha(a)-parseFecha(b))/86400000); }
function addDias(s,n){ var dt=parseFecha(s); dt.setDate(dt.getDate()+n); return fmtFecha(dt); }

(function(){
  var PRODUCTOS=[], buscar='', _t=null;
  var BASE='2025-06-08', HOY='2026-06-08', MAXOFF=365, SALES_BASE='2025-12-01';
  var DIMORDER=[], DIMLABEL={}, STORES={}, STORE_OP=[];
  var desde, hasta, offD=0, offH=0, diasRango=1;
  var niveles=[], seleccion={}, dropdownAbierto=null, grupoSel=null;

  var sucSel={}, sucDDAbierto=false;
  function tiendasActivas(){ var k=Object.keys(sucSel); if(!k.length) return STORE_OP; var f=STORE_OP.filter(function(o){ return sucSel[o.loc]; }); return f.length?f:STORE_OP; }
  function sucLabel(){ var n=Object.keys(sucSel).length; return (n&&n<STORE_OP.length)? (n+' de '+STORE_OP.length) : ('Todas ('+STORE_OP.length+')'); }

  function fechaToOff(s){ return Math.max(0, Math.min(MAXOFF, diffDias(s, BASE))); }
  function parseStockStr(s){ var out=[]; if(!s) return out; s.split(',').forEach(function(t){ if(!t) return; var p=t.split(':'); out.push([+p[0],+p[1],+p[2]]); }); return out; }
  function parseSalesStr(s){ var out=[]; if(!s) return out; s.split('|').forEach(function(blk){ if(!blk||blk.indexOf('#')<0) return; var i=blk.indexOf('#'); var loc=+blk.slice(0,i); var pares=[]; blk.slice(i+1).split(',').forEach(function(t){ if(!t) return; var ab=t.split(':'); pares.push([+ab[0],+ab[1]]); }); out.push([loc,pares]); }); return out; }
  function totalStockTiendas(p){ var t=0; for(var i=0;i<p.STOCK.length;i++) t+=p.STOCK[i][1]; return t; }

  // ===== Filtros por identificador =====
  function pasaDims(p, exceptKey){
    for(var i=0;i<niveles.length;i++){ var k=niveles[i]; if(k===exceptKey) continue;
      var sel=seleccion[k]; if(!sel) continue; var keys=Object.keys(sel); if(!keys.length) continue;
      if(!sel[p.dim[k]||'']) return false;
    }
    return true;
  }
  function pasaBuscar(p){
    var q=buscar.trim().toUpperCase(); if(!q) return true;
    var c=(p.codigo||'').toUpperCase(),nm=(p.nombre||'').toUpperCase(),mc=(p.dim.marca||'').toUpperCase();
    return c.indexOf(q)>=0||nm.indexOf(q)>=0||mc.indexOf(q)>=0;
  }
  function valoresDe(key){
    var acc={};
    PRODUCTOS.forEach(function(p){ if(!pasaDims(p,key)) return;
      var v=p.dim[key]||('(Sin '+(DIMLABEL[key]||key).toLowerCase()+')'); acc[v]=(acc[v]||0)+totalStockTiendas(p); });

    }
    lista.sort(function(a,b){ return a.d-b.d || a.m-b.m || (b.v-a.v); });
    _hkDrill={ val:val, loc:loc, sucNombre:sucNombre, sucDestino:sucDestino, lista:lista, odoo:null };

    var tv=0,te=0,tm=0,tcd=0,ttr=0,trc=0,tneg=0;
    lista.forEach(function(x){ tv+=x.v; te+=x.e; tm+=x.m; tcd+=x.cd; ttr+=x.tr; trc+=x.rc; if(x.d<0){ tneg+=x.d; } });
    var TOPE=400, corta=lista.length>TOPE, vis=corta?lista.slice(0,TOPE):lista;
    _hkDrill.vis=vis;

    _hkDrill.huecoPzas=tneg*-1;  // hueco del concepto (bolsa de piezas), positivo
    _hkDrill.huecoValor=Math.round(lista.reduce(function(a,x){return a+(x.d<0?x.m:0);},0))*-1;
    var ov=document.createElement('div'); ov.id='hk-modal-ov';
    ov.innerHTML='<div id="hk-modal">'+
      '<div class="hk-m-head"><div style="flex:1"><div class="hk-m-tit">'+escH(val)+' · '+escH(sucNombre)+'</div>'+
      '<div class="hk-m-sub">Rango '+desde+' a '+hasta+' · <span id="hk-odoo-estado" style="color:var(--azul)">consultando CEDIS en vivo…</span></div>'+
      '<div class="hk-cont" id="hk-cont"></div></div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+
        '<button class="btn" id="hk-snap-btn" title="Guarda el hueco de este concepto en el repositorio de la semana" style="border:1.5px solid var(--morado);background:transparent;color:var(--morado)">Registrar en la semana</button>'+
        '<button class="btn pdf" id="hk-folio-btn" disabled title="Genera el folio de abastecimiento con lo disponible en CEDIS">Generar folio de abasto</button>'+
        '<button class="hk-m-x" title="Cerrar">✕</button>'+
      '</div></div>'+
      '<div class="hk-m-body" id="hk-m-body"></div>'+
      '<div class="hk-sim-wrap" id="hk-sim-wrap"></div></div>';
    ov.addEventListener('click',function(e){ if(e.target===ov) cerrarDrill(); });
    ov.querySelector('.hk-m-x').addEventListener('click',cerrarDrill);
    ov.querySelector('#hk-folio-btn').addEventListener('click',generarFolioHueco);
    ov.querySelector('#hk-snap-btn').addEventListener('click',registrarSnapshot);
    document.body.appendChild(ov);
    document.addEventListener('keydown',escDrill);
    pintarDrillBody();           // pinta con datos de la FOTO
    pintarSimilares();           // zona de similares (vacía hasta tener Odoo)
    cargarExistenciaOdoo();      // y pide la existencia en vivo a Odoo
    actualizarContador();
  }

  // Contador vivo: cuánto del hueco del concepto se está cubriendo (mismo SKU + similares)
  function actualizarContador(){
    if(!_hkDrill) return;
    var el=document.getElementById('hk-cont'); if(!el) return;
    var hue=_hkDrill.huecoPzas||0;
    var cs=0; document.querySelectorAll('.hk-surtir').forEach(function(i){ cs+=Math.max(0,Math.round(Number(i.value)||0)); });
    var cm=0; document.querySelectorAll('.hk-sim-pz').forEach(function(i){ cm+=Math.max(0,Math.round(Number(i.value)||0)); });
    var tot=cs+cm, falta=Math.max(0,hue-tot), pct=hue>0?Math.min(100,Math.round(tot/hue*100)):0;
    el.innerHTML=
      '<span class="hk-chip rojo">Hueco del concepto: <b>'+num(hue)+' pzas</b></span>'+
      '<span class="hk-chip">Cubierto: <b style="color:var(--verde)">'+num(tot)+'</b> ('+pct+'%)</span>'+
      '<span class="hk-chip">· mismo SKU: <b>'+num(cs)+'</b></span>'+
      '<span class="hk-chip">· similares: <b style="color:var(--morado)">'+num(cm)+'</b></span>'+
      '<span class="hk-chip'+(falta>0?' rojo':'')+'">Falta: <b>'+num(falta)+'</b></span>'+
      '<div class="hk-barra"><div class="hk-barra-sku" style="width:'+(hue>0?Math.min(100,cs/hue*100):0)+'%"></div><div class="hk-barra-sim" style="width:'+(hue>0?Math.min(100-((cs/hue)*100),cm/hue*100):0)+'%"></div></div>';
    var btn=document.getElementById('hk-folio-btn'); if(btn) btn.disabled=(tot<=0);
  }

  // Columnas ordenables del modal: clave, etiqueta, si es numérica y cómo obtener su valor de la fila enriquecida
  var HK_COLS=[
    {k:'sku',    t:'SKU',          num:false, get:function(r){return (r.p.codigo||'').toUpperCase();}},
    {k:'nombre', t:'Nombre',       num:false, get:function(r){return (r.p.nombre||'').toUpperCase();}},
    {k:'venta',  t:'Venta',        num:true,  get:function(r){return r.v;}},
    {k:'exist',  t:'Exist.',       num:true,  get:function(r){return r.exSuc;}},
    {k:'hueco',  t:'Hueco',        num:true,  get:function(r){return r.hueco;}},
    {k:'cedis',  t:'CEDIS',        num:true,  get:function(r){return r.cedis;}},
    {k:'surtir', t:'Surtir',       num:true,  get:function(r){return r.surtir;}},
    {k:'falta',  t:'Sin cubrir',   num:true,  get:function(r){return r.falta;}},
    {k:'precio', t:'Precio',       num:true,  get:function(r){return r.p.precio||0;}}
  ];
  // Calcula los valores enriquecidos (existencia, hueco, cedis, surtir, falta) de cada SKU visible.
  function hkEnriquecer(){
    var od=_hkDrill.odoo, enVivo=!!od;
    return _hkDrill.vis.map(function(x){ var p=x.p, pid=p.product_id;
      var cedis = enVivo && pid!=null && od[pid] ? od[pid].cedis : x.cd;
      var exSuc=0; _hkDrill.sucDestino.forEach(function(sd){ exSuc += (enVivo && pid!=null && od[pid] && od[pid].suc_libre) ? (od[pid].suc_libre[sd.loc]||0) : (hkStock(p)[sd.loc]||0); });
      var hueco=0; Object.keys(x.porSuc).forEach(function(l){ hueco += x.porSuc[l].hueco; });
      // surtir: lo que el usuario haya editado (por product_id), o el sugerido = min(hueco, cedis)
      var ed=_hkDrill.surtirEdit; var edv=(ed && pid!=null && ed[pid]!=null)?ed[pid]:null;
      var surtir = edv!=null ? Math.max(0, Math.min(hueco, edv)) : Math.max(0, Math.min(hueco, cedis));
      var falta = Math.max(0, hueco - surtir);
      return {x:x, p:p, pid:pid, v:x.v, exSuc:exSuc, hueco:hueco, cedis:cedis, surtir:surtir, falta:falta};
    });
  }
  // Pinta el cuerpo del modal. Si ya hay datos de Odoo (_hkDrill.odoo), usa esos para CEDIS/sucursal y calcula "Surtir".
  function pintarDrillBody(){
    if(!_hkDrill) return;
    if(!_hkDrill.surtirEdit) _hkDrill.surtirEdit={};
    if(!_hkDrill.ord) _hkDrill.ord={col:'hueco', dir:'desc'};  // por defecto: hueco de mayor a menor
    var od=_hkDrill.odoo, enVivo=!!od;
    var filas=hkEnriquecer();
    // ordenar según la columna elegida
    var oc=_hkDrill.ord.col, dir=_hkDrill.ord.dir==='asc'?1:-1;
    var colDef=HK_COLS.filter(function(c){return c.k===oc;})[0]||HK_COLS[4];
    filas.sort(function(a,b){ var va=colDef.get(a), vb=colDef.get(b);
      if(colDef.num) return (va-vb)*dir;
      return String(va).localeCompare(String(vb),'es')*dir;
    });
    var tv=0,te=0,tcd=0,tsurt=0,tfalt=0;
    _hkDrill.lista.forEach(function(x){ tv+=x.v; });
    var rows=filas.map(function(r){ var p=r.p;
      te+=r.exSuc; tcd+=r.cedis; tsurt+=r.surtir; tfalt+=r.falta;
      return '<tr>'+
        '<td style="font-weight:600">'+escH(p.codigo||'—')+'</td>'+
        '<td style="white-space:normal;max-width:220px">'+escH(p.nombre||'')+'</td>'+
        '<td class="num">'+num(r.v)+'</td>'+
        '<td class="num">'+num(r.exSuc)+'</td>'+
        '<td class="num hk-neg" style="font-weight:700">'+num(r.hueco)+'</td>'+
        '<td class="num" style="color:var(--dorado);font-weight:600">'+num(r.cedis)+'</td>'+
        '<td class="num"><input type="number" class="hk-surtir" data-pid="'+(r.pid!=null?r.pid:'')+'" value="'+r.surtir+'" min="0" max="'+r.hueco+'" style="width:64px;text-align:right;border:1.5px solid var(--line);border-radius:6px;padding:4px 6px;font-family:inherit;font-variant-numeric:tabular-nums"></td>'+
        '<td class="num'+(r.falta>0?' hk-neg':'')+'">'+num(r.falta)+'</td>'+
        '<td class="num">'+money(Math.round(p.precio||0))+'</td>'+
        '</tr>'; }).join('');
    var corta=_hkDrill.lista.length>filas.length;
    var notaC=corta?('<tr><td colspan="9" class="nota">Mostrando '+num(filas.length)+' de '+num(_hkDrill.lista.length)+' SKU´s. Los totales consideran todos.</td></tr>'):'';
    var foot='<tr style="font-weight:700;background:#efe9df"><td>TOTAL</td><td>'+num(_hkDrill.lista.length)+' SKU´s</td>'+
      '<td class="num">'+num(tv)+'</td><td class="num">'+num(te)+'</td>'+
      '<td class="num hk-neg" id="hk-ft-hueco">—</td>'+
      '<td class="num" id="hk-ft-cedis">'+num(tcd)+'</td>'+
      '<td class="num" style="color:var(--verde)" id="hk-ft-surtir">'+num(tsurt)+'</td>'+
      '<td class="num" id="hk-ft-falta">'+num(tfalt)+'</td><td></td></tr>';
    // encabezados clicables con flecha de orden
    var tit={exist:(enVivo?'Existencia en la sucursal destino (en vivo de Odoo)':'Existencia en la sucursal destino'),
             cedis:(enVivo?'Disponible en CEDIS en vivo (físico − reservado)':'Disponible en CEDIS'),
             surtir:'Piezas a enviar de CEDIS a la sucursal', falta:'Hueco que no alcanza a cubrir CEDIS'};
    var etq={exist:'Exist. '+(enVivo?'(Odoo)':'tienda'), cedis:'CEDIS '+(enVivo?'(Odoo)':'')};
    var ths=HK_COLS.map(function(c){
      var activo=(c.k===oc); var flecha=activo?(_hkDrill.ord.dir==='asc'?' ▲':' ▼'):'';
      var label=etq[c.k]||c.t;
      return '<th class="hk-ord'+(c.num?' num':'')+(activo?' hk-ord-on':'')+'" data-col="'+c.k+'"'+(tit[c.k]?' title="'+tit[c.k]+'"':'')+' style="cursor:pointer;user-select:none">'+label+flecha+'</th>';
    }).join('');
    document.getElementById('hk-m-body').innerHTML='<table><thead><tr>'+ths+'</tr></thead><tbody>'+rows+notaC+'</tbody><tfoot>'+foot+'</tfoot></table>';
    // clic en encabezado: ordena (primer clic en una columna nueva = descendente / mayor a menor)
    document.getElementById('hk-m-body').addEventListener('click',function(e){
      var th=e.target.closest&&e.target.closest('.hk-ord'); if(!th) return;
      var col=th.getAttribute('data-col');
      if(_hkDrill.ord.col===col){ _hkDrill.ord.dir=(_hkDrill.ord.dir==='asc'?'desc':'asc'); }
      else { _hkDrill.ord.col=col; _hkDrill.ord.dir='desc'; }
      guardarSurtirEditado(); pintarDrillBody();
    });
    // al editar surtir: recordar el valor por product_id y recalcular totales
    document.getElementById('hk-m-body').addEventListener('input',function(e){
      var inp=e.target.closest&&e.target.closest('.hk-surtir'); if(!inp) return;
      var pid=inp.getAttribute('data-pid'); if(pid!==''){ _hkDrill.surtirEdit[pid]=Math.max(0, Math.min(Number(inp.max)||0, Math.round(Number(inp.value)||0))); }
      recalcSurtir();
    });
    recalcSurtir();
  }
  // Guarda en _hkDrill.surtirEdit lo que el usuario tiene escrito, para no perderlo al reordenar.
  function guardarSurtirEditado(){
    if(!_hkDrill) return; _hkDrill.surtirEdit=_hkDrill.surtirEdit||{};
    document.querySelectorAll('.hk-surtir').forEach(function(inp){ var pid=inp.getAttribute('data-pid'); if(pid!==''){ _hkDrill.surtirEdit[pid]=Math.max(0, Math.min(Number(inp.max)||0, Math.round(Number(inp.value)||0))); } });
  }
  function recalcSurtir(){
    var inputs=document.querySelectorAll('.hk-surtir'); var tsurt=0;
    inputs.forEach(function(inp){ var v=Math.max(0, Math.min(Number(inp.max)||0, Math.round(Number(inp.value)||0))); tsurt+=v; });
    var ft=document.getElementById('hk-ft-surtir'); if(ft) ft.textContent=num(tsurt);
    actualizarContador();
  }

  // Pide a Odoo (abs-odoo) la existencia en vivo de CEDIS y sucursales destino.
  // Además pide los SIMILARES del concepto que hay en CEDIS (otros SKU del mismo filtro).
  function cargarExistenciaOdoo(){
    if(!_hkDrill) return;
    var est=document.getElementById('hk-odoo-estado');
    // product_ids de los SKU con hueco (para su existencia en tienda) + TODOS los SKU del concepto (para ver cuáles hay en CEDIS)
    var pares=[]; var pidsConHueco={}; var simWrap={};
    _hkDrill.lista.forEach(function(x){ var pid=x.p.product_id; if(pid==null) return; pidsConHueco[pid]=1;
      _hkDrill.sucDestino.forEach(function(sd){ pares.push([sd.loc, pid]); }); });
    // candidatos a similar: todos los productos del mismo concepto filtrado (tengan o no hueco)
    var gk=grupoKey(); var candidatos=[];
    for(var i=0;i<PRODUCTOS.length;i++){ var p=PRODUCTOS[i];
      if(!pasaDims(p,null)) continue;
      var pv=p.dim[gk]||('(Sin '+(DIMLABEL[gk]||gk).toLowerCase()+')'); if(pv!==_hkDrill.val) continue;
      if(p.product_id==null) continue;
      candidatos.push(p); pares.push([0, p.product_id]); // loc 0 = solo nos interesa su CEDIS
    }
    _hkDrill.candidatos=candidatos;
    if(!pares.length){ if(est){ est.textContent='sin product_id para consultar Odoo (se usa la foto)'; est.style.color='var(--dim)'; } return; }
    fetch('/api/abs-odoo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pares:pares})})
      .then(function(r){return r.json();})
      .then(function(res){
        if(!res||!res.ok||!res.existencias){ if(est){ est.textContent='no se pudo leer Odoo: '+((res&&res.error)||'error')+' — se usa la foto'; est.style.color='var(--rojo)'; } return; }
        _hkDrill.odoo=res.existencias;
        if(est){ est.textContent='CEDIS y existencia en vivo ✓'; est.style.color='var(--verde)'; }
        pintarDrillBody();
        pintarSimilares();
        actualizarContador();
      })
      .catch(function(e){ if(est){ est.textContent='no se pudo contactar Odoo — se usa la foto'; est.style.color='var(--rojo)'; } });
  }

  // Zona inferior: productos SIMILARES (mismo concepto filtrado) que hay en CEDIS y que
  // NO se están usando ya para su propio hueco con mismo SKU. Sirven para cubrir el resto del hueco.
  function pintarSimilares(){
    if(!_hkDrill) return;
    var wrap=document.getElementById('hk-sim-wrap'); if(!wrap) return;
    var od=_hkDrill.odoo;
    if(!od){ wrap.innerHTML='<div class="hk-sim-head">Productos similares en CEDIS <span class="hk-sim-note">— esperando existencia en vivo de Odoo…</span></div>'; return; }
    // SKU que ya tienen hueco propio (para no listarlos como "similar": esos van arriba con su mismo SKU)
    var conHueco={}; _hkDrill.lista.forEach(function(x){ if(x.p.product_id!=null) conHueco[x.p.product_id]=1; });
    var sims=[];
    (_hkDrill.candidatos||[]).forEach(function(p){ var pid=p.product_id; if(pid==null) return;
      var cd = od[pid] ? od[pid].cedis : 0; if(cd<=0) return;          // solo los que SÍ hay en CEDIS
      // cuánto de ese CEDIS ya se está comprometiendo arriba (si el mismo SKU tiene hueco y se está surtiendo)
      sims.push({p:p, cedis:cd, esConHueco:!!conHueco[pid]});
    });
    // los que NO tienen hueco propio son los "similares puros"; los que sí, ya aparecen arriba. Mostramos los puros.
    var puros=sims.filter(function(s){ return !s.esConHueco; });
    puros.sort(function(a,b){ return b.cedis-a.cedis; });
    _hkDrill.sims=puros;
    if(!puros.length){ wrap.innerHTML='<div class="hk-sim-head">Productos similares en CEDIS <span class="hk-sim-note">— no hay otros SKU de este concepto con existencia en CEDIS</span></div>'; return; }
    var rows=puros.map(function(s,idx){ var p=s.p;
      return '<tr>'+
        '<td style="font-weight:600">'+escH(p.codigo||'—')+'</td>'+
        '<td style="white-space:normal;max-width:300px">'+escH(p.nombre||'')+'</td>'+
        '<td class="num" style="color:var(--dorado);font-weight:600">'+num(s.cedis)+'</td>'+
        '<td class="num"><input type="number" class="hk-sim-pz" data-pid="'+p.product_id+'" value="0" min="0" max="'+s.cedis+'" style="width:64px;text-align:right;border:1.5px solid var(--morado);border-radius:6px;padding:4px 6px;font-family:inherit;font-variant-numeric:tabular-nums"></td>'+
        '<td class="num">'+money(Math.round(p.precio||0))+'</td>'+
        '</tr>'; }).join('');
    wrap.innerHTML='<div class="hk-sim-head">Cubrir con similares en CEDIS <span class="hk-sim-note">— otros SKU de «'+escH(_hkDrill.val)+'» con existencia en CEDIS. Asigna piezas para cubrir el hueco restante del concepto.</span></div>'+
      '<div class="hk-sim-body"><table><thead><tr><th>SKU</th><th>Nombre</th><th class="num">CEDIS</th><th class="num">Enviar</th><th class="num">Precio</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    wrap.querySelector('.hk-sim-body').addEventListener('input',function(e){ var i=e.target.closest&&e.target.closest('.hk-sim-pz'); if(i) actualizarContador(); });
  }

  // Guarda el hueco de este concepto en el repositorio de la semana (Supabase).
  function registrarSnapshot(){
    if(!_hkDrill) return;
    var btn=document.getElementById('hk-snap-btn'), est=document.getElementById('hk-odoo-estado');
    // clave estable del concepto = identificadores filtrados (valores) + sucursales destino
    var filtros={}; niveles.forEach(function(k){ var sel=seleccion[k]; filtros[k]=sel?Object.keys(sel):[]; });
    var clave=grupoKey()+'|'+_hkDrill.val+'|'+_hkDrill.sucDestino.map(function(s){return s.loc;}).sort().join(',');
    var payload={ accion:'registrar', concepto_clave:clave, concepto_label:_hkDrill.val+' · '+_hkDrill.sucNombre,
      filtros:filtros, agrupa_por:grupoKey(), sucursales:_hkDrill.sucDestino,
      rango_desde:desde, rango_hasta:hasta, hueco_piezas:_hkDrill.huecoPzas, hueco_valor:_hkDrill.huecoValor,
      sku_count:_hkDrill.lista.length, creado_por:(window.TOKEN_USER||'tablero-huecos') };
    btn.disabled=true; var t0=btn.textContent; btn.textContent='Registrando…';
    fetch('/api/huecos-snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json();}).then(function(res){
        if(!res||!res.ok){ alert('No se pudo registrar en la semana: '+((res&&res.error)||'error')); btn.disabled=false; btn.textContent=t0; return; }
        _hkDrill.snapshot_id=res.snapshot&&res.snapshot.id;
        btn.textContent='Registrado · '+(res.semana&&res.semana.semana||'');
        if(est){ est.innerHTML=est.innerHTML+' · <b style="color:var(--morado)">guardado en '+(res.semana&&res.semana.semana||'la semana')+'</b>'; }
      }).catch(function(e){ alert('Error de red al registrar: '+String(e)); btn.disabled=false; btn.textContent=t0; });
  }

  // Arma las líneas (SKU × sucursal, repartiendo lo que se va a surtir) y crea el folio vía abs-folios.
  function generarFolioHueco(){
    if(!_hkDrill) return;
    var btn=document.getElementById('hk-folio-btn'); var est=document.getElementById('hk-odoo-estado');
    var od=_hkDrill.odoo;
    // surtir por product_id (lo que el usuario tiene escrito ahora en la tabla)
    guardarSurtirEditado();
    var surtirPorPid={}; document.querySelectorAll('.hk-surtir').forEach(function(inp){ var pid=inp.getAttribute('data-pid'); if(pid!=='') surtirPorPid[pid]=Math.max(0, Math.round(Number(inp.value)||0)); });
    var lineas=[]; var cobertura=[];
    var sucPrincipal=_hkDrill.sucDestino[0]||{loc:null,code:null};
    // 1) mismo SKU: surtir lo escrito, repartido por sucursal con hueco
    _hkDrill.vis.forEach(function(x){ var p=x.p; if(p.product_id==null) return; var total=surtirPorPid[String(p.product_id)]||0; if(total<=0) return;
      var sucs=Object.keys(x.porSuc).map(function(l){ return x.porSuc[l]; }).sort(function(a,b){ return b.hueco-a.hueco; });
      var resta=total;
      sucs.forEach(function(sd){ if(resta<=0) return; var asignar=Math.min(sd.hueco, resta); if(asignar<=0) return; resta-=asignar;
        lineas.push({ suc:sd.loc, sucursal_nom:sd.code, product_id:p.product_id, product_tmpl_id:p.id, sku:p.codigo, nombre:p.nombre,
          vendidas:(hkVentas(p)[sd.loc]||0), transito:0, sugeridas:sd.hueco, surtir:asignar, precio:p.precio||null, utilidad:null });
        cobertura.push({ tipo:'sku', product_id:p.product_id, product_tmpl_id:p.id, sku:p.codigo, nombre:p.nombre,
          sucursal_loc:sd.loc, sucursal_code:sd.code, piezas:asignar, precio:p.precio||null }); });
    });
    // 2) similares: lo asignado en la zona de abajo (va a la sucursal principal del drill)
    document.querySelectorAll('.hk-sim-pz').forEach(function(inp){ var pid=inp.getAttribute('data-pid'); var pz=Math.max(0,Math.round(Number(inp.value)||0)); if(pz<=0||pid==='') return;
      var s=(_hkDrill.sims||[]).filter(function(y){return String(y.p.product_id)===String(pid);})[0]; if(!s) return; var p=s.p;

  // ===== Plan de surtido sugerido =====
  // Hueco por SKU×tienda = venta del rango − existencia (cuando es positivo).
  // Se reparte la existencia CEDIS de cada SKU entre sus tiendas con hueco:
  // si alcanza, se cubre todo; si no, se prorratea dando prioridad al hueco mayor.
  function calcularPlan(){
    var SOP=tiendasActivas(), lineas=[], porSuc={}, totHueco=0, totEnv=0, totVal=0, totPend=0, skus=0;
    for(var i=0;i<PRODUCTOS.length;i++){ var p=PRODUCTOS[i];
      if(!pasaDims(p,null)) continue;
      var V=hkVentas(p), E=hkStock(p), needs=[], totalNeed=0;
      for(var j=0;j<SOP.length;j++){ var l=+SOP[j].loc, v=V[l]||0, e=E[l]||0, n=v-e;
        if(n>0){ needs.push({loc:l, code:SOP[j].code, need:n, a:0}); totalNeed+=n; } }
      if(!totalNeed) continue;
      skus++;
      var cd=Math.max(0, p.cedis||0), disp=cd;
      if(disp>=totalNeed){ needs.forEach(function(x){ x.a=x.need; }); disp-=totalNeed; }
      else if(disp>0){
        var sum=0; needs.forEach(function(x){ x.a=Math.floor(disp*x.need/totalNeed); sum+=x.a; });
        var resto=disp-sum;
        needs.sort(function(a,b){ return b.need-a.need; });
        for(var k=0;k<needs.length&&resto>0;k++){ if(needs[k].a<needs[k].need){ needs[k].a++; resto--; } }
        disp=0;
      }
      var llega=(p.transito||0)+(p.recep||0), px=p.precio||0;
      needs.forEach(function(x){
        var env=x.a, pend=x.need-env, val=env*px;
        lineas.push({p:p, suc:x.code, loc:x.loc, hueco:x.need, env:env, pend:pend, cedis:cd, llega:llega, px:px, val:val});
        totHueco+=x.need; totEnv+=env; totVal+=val; totPend+=pend;
        var ps=porSuc[x.loc]||(porSuc[x.loc]={code:x.code, hueco:0, env:0, pend:0, val:0});
        ps.hueco+=x.need; ps.env+=env; ps.pend+=pend; ps.val+=val;
      });
    }
    lineas.sort(function(a,b){ return b.val-a.val || b.hueco-a.hueco; });
    var sucArr=Object.keys(porSuc).map(function(l){ return porSuc[l]; }).sort(function(a,b){ return b.env-a.env; });
    return { lineas:lineas, porSuc:sucArr, skus:skus, totHueco:totHueco, totEnv:totEnv, totVal:totVal, totPend:totPend };
  }

  function exportarHuecosExcel(){

    if(esSKU){ var si=document.getElementById('hk-sku');
      function commitAll(){ var parts=si.value.split(/[\s,;\n]+/).map(function(t){return t.trim();}).filter(Boolean);
        var add=false; parts.forEach(function(t){ var u=t.toUpperCase(); if(!skuLista.some(function(x){return x.toUpperCase()===u;})){ skuLista.push(t); add=true; } });
        si.value=''; if(add){ renderSkuChips(); renderHuecos(); } }
      si.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===','||e.key===' '||e.key===';'){ e.preventDefault(); if(si.value.trim()) commitAll(); }
        else if(e.key==='Backspace' && !si.value && skuLista.length){ skuLista.pop(); renderSkuChips(); renderHuecos(); }
      });
      si.addEventListener('paste',function(e){ setTimeout(commitAll,0); });
      si.addEventListener('blur',function(){ if(si.value.trim()) commitAll(); });
      document.getElementById('hk-sku-box').addEventListener('click',function(){ si.focus(); });
      document.getElementById('hk-sku-x').addEventListener('click',function(){ skuLista=[]; si.value=''; renderSkuChips(); renderHuecos(); si.focus(); });
      renderSkuChips();
    }
    document.getElementById('hk-plan').addEventListener('click',abrirPlan);
    function pintarSucDD(){
      var wrap=document.getElementById('hk-suc-wrap'); if(!wrap) return;
      if(!sucDDAbierto){ wrap.innerHTML=''; return; }
      var dd=document.createElement('div'); dd.className='dropdown'; dd.style.top='4px';
      dd.addEventListener('click',function(e){ e.stopPropagation(); });
      var head=document.createElement('div'); head.className='dd-head'; head.innerHTML='<input type="text" placeholder="Buscar sucursal\u2026">'; dd.appendChild(head);
      var acc=document.createElement('div'); acc.className='dd-acciones'; acc.innerHTML='<a data-a="todos">Seleccionar todo</a><a data-a="ninguno">Limpiar</a>'; dd.appendChild(acc);
      var list=document.createElement('div'); list.className='dd-list'; dd.appendChild(list);
      function pintarL(filtro){ list.innerHTML='';
        STORE_OP.forEach(function(o){ if(filtro&&o.code.toLowerCase().indexOf(filtro)<0) return;
          var marcado=!!sucSel[o.loc]; var item=document.createElement('label'); item.className='dd-item';
          item.innerHTML='<input type="checkbox" '+(marcado?'checked':'')+'><span>'+escH(o.code)+'</span>';
          item.querySelector('input').addEventListener('change',function(ev){ if(ev.target.checked) sucSel[o.loc]=true; else delete sucSel[o.loc];
            document.getElementById('hk-suc-btn').innerHTML=sucLabel()+' \u25be'; renderHuecos(); });
          list.appendChild(item);
        });
        if(!list.children.length) list.innerHTML='<div style="padding:14px;color:var(--dim);font-size:13px">Sin coincidencias</div>';
      }
      pintarL('');
      head.querySelector('input').addEventListener('input',function(e){ pintarL(e.target.value.toLowerCase()); });
      acc.querySelector('[data-a=todos]').addEventListener('click',function(){ sucSel={}; document.getElementById('hk-suc-btn').innerHTML=sucLabel()+' \u25be'; pintarL(head.querySelector('input').value.toLowerCase()); renderHuecos(); });
      acc.querySelector('[data-a=ninguno]').addEventListener('click',function(){ sucSel={}; document.getElementById('hk-suc-btn').innerHTML=sucLabel()+' \u25be'; pintarL(head.querySelector('input').value.toLowerCase()); renderHuecos(); });
      wrap.innerHTML=''; wrap.appendChild(dd);
    }
    document.getElementById('hk-suc-btn').addEventListener('click',function(e){ e.stopPropagation(); sucDDAbierto=!sucDDAbierto; pintarSucDD(); });
    window._cerrarSucDD=function(){ if(sucDDAbierto){ sucDDAbierto=false; pintarSucDD(); } };
    var dz=document.getElementById('det-drop');
    dz.addEventListener('dragover',function(e){ e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave',function(){ dz.classList.remove('dragover'); });
    dz.addEventListener('drop',function(e){ e.preventDefault(); dz.classList.remove('dragover'); var k=e.dataTransfer.getData('text/plain'); if(k&&niveles.indexOf(k)<0){ niveles.push(k); seleccion[k]={}; dropdownAbierto=k; renderFiltros(); renderHuecos(); } });
    document.addEventListener('click',function(){ if(dropdownAbierto){ dropdownAbierto=null; renderNiveles(); } if(window._cerrarSucDD) window._cerrarSucDD(); });
    recomputar(); syncControles(); renderFiltros(); renderHuecos();
    document.getElementById('gen').textContent='ACTUALIZADO '+new Date().toLocaleString('es-MX')+(window._VER?(' · '+window._VER):'');
  }

  function renderSkuChips(){ var box=document.getElementById('hk-sku-chips'); if(!box) return; box.innerHTML='';
    skuLista.forEach(function(t,i){ var c=document.createElement('span'); c.className='sku-chip'; c.innerHTML=escH(t)+'<span class="x">✕</span>';
      c.querySelector('.x').addEventListener('click',function(e){ e.stopPropagation(); skuLista.splice(i,1); renderSkuChips(); renderHuecos(); }); box.appendChild(c); });
    var el=document.getElementById('hk-sku-cnt'); var n=skuLista.length; if(el) el.textContent=n?('· '+n+' SKU'+(n===1?'':'s')+' en filtro'):'';
  }
  function showError(m){ document.getElementById('cont-ant').innerHTML='<div class="state"><div class="big">No se pudieron cargar los datos</div><div class="errbox">'+m+'</div></div>'; }
  function procesarJSON(j){
    if(!j||!j.ok){ showError(String((j&&j.error)||'Datos inválidos')); return; }
    BASE=j.base||BASE; HOY=j.hoy||HOY; MAXOFF=(j.maxOff!=null?j.maxOff:365);
    SALES_BASE=j.salesBase||SALES_BASE;
    DIMORDER=j.dimOrder||[]; DIMLABEL=j.dimLabel||{}; STORES=j.stores||{};
    var D=j.dims||{};
    STORE_OP=Object.keys(STORES).map(function(loc){ return {loc:loc, code:STORES[loc]}; }).sort(function(a,b){ return a.code.localeCompare(b.code,'es'); });
    PRODUCTOS=(j.rows||[]).map(function(r){
      var dim={}; for(var i=0;i<DIMORDER.length;i++){ var k=DIMORDER[i]; dim[k]=(D[k]||[])[r[5+i]]; }
      return { id:r[0], codigo:r[1], nombre:r[2], precio:r[3]||0, costo:(r[4]!=null?r[4]:null),
        dim:dim, cedis:r[5+DIMORDER.length]||0, STOCK:parseStockStr(r[6+DIMORDER.length]), SALES:parseSalesStr(r[7+DIMORDER.length]),
        transito:r[8+DIMORDER.length]||0, recep:r[9+DIMORDER.length]||0, product_id:r[10+DIMORDER.length]||null };
    });
    hasta=HOY; desde=addDias(HOY,-89);
    if(diffDias(desde,SALES_BASE)<0) desde=SALES_BASE;
    var esFoto=!!(window.DATOS_LZ||window.DATOS);
    window._VER=esFoto?('FOTO '+(j.generado||'')):'EN VIVO';
    var badge=document.getElementById('badge-modo');
    if(badge) badge.innerHTML='<span class="dot"></span> '+(esFoto?('FOTO '+(j.generado||'')):'EN VIVO');
    pintar(); initTabs();
  }
  // ===================== PESTAÑA SEMANA (repositorio de huecos) =====================
  var _semActual=null, _semData=null;
  function semanaISOhoy(){
    var hoy=new Date(HOY+'T12:00:00'); var dow=(hoy.getDay()+6)%7; var lun=new Date(hoy); lun.setDate(hoy.getDate()-dow);
    var d=new Date(Date.UTC(lun.getFullYear(),lun.getMonth(),lun.getDate())); var dn=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dn+3);
    var ft=new Date(Date.UTC(d.getUTCFullYear(),0,4)); var wk=1+Math.round(((d-ft)/86400000-3+((ft.getUTCDay()+6)%7))/7);
    return d.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
  }
  function pintarSemana(){
    var cont=document.getElementById('cont-ant');
    if(!_semActual) _semActual=semanaISOhoy();
    cont.innerHTML=
      '<div class="ctrl"><div class="et">Repositorio de huecos por semana · lo que registraste y cuánto has cubierto</div>'+
        '<div class="fila">'+
          '<div class="fg"><label>Semana</label><select id="sem-sel"><option value="'+_semActual+'">'+_semActual+' (actual)</option></select></div>'+
          '<button class="btn" id="sem-refresh" style="border:1.5px solid var(--morado);background:transparent;color:var(--morado)">Actualizar</button>'+
          '<span class="dias-info" id="sem-estado">cargando…</span>'+
          '<button class="btn xls" id="sem-xls" style="margin-left:auto">Descargar Excel</button>'+
        '</div>'+
      '</div>'+
      '<div class="resumen" id="sem-resumen"></div>'+
      '<div class="panel"><div id="sem-tabla"></div></div>';
    document.getElementById('sem-refresh').addEventListener('click',cargarSemana);
    document.getElementById('sem-sel').addEventListener('change',function(e){ _semActual=e.target.value; cargarSemana(); });
    document.getElementById('sem-xls').addEventListener('click',exportarSemanaExcel);
    cargarSemanasDisponibles();
    cargarSemana();
    document.getElementById('gen').textContent='ACTUALIZADO '+new Date().toLocaleString('es-MX')+(window._VER?(' · '+window._VER):'');
  }
  function cargarSemanasDisponibles(){
    fetch('/api/huecos-snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'semanas'})})
      .then(function(r){return r.json();}).then(function(res){
        if(!res||!res.ok||!res.semanas) return; var sel=document.getElementById('sem-sel'); if(!sel) return;
        var vals={}; vals[_semActual]=1; var opts=['<option value="'+_semActual+'">'+_semActual+' (actual)</option>'];
        res.semanas.forEach(function(s){ if(s.semana===_semActual) return; vals[s.semana]=1; opts.push('<option value="'+s.semana+'">'+s.semana+' ('+s.semana_ini+' a '+s.semana_fin+')</option>'); });
        sel.innerHTML=opts.join('');
        sel.value=_semActual;
      }).catch(function(){});
  }
  function cargarSemana(){
    var est=document.getElementById('sem-estado'); if(est){ est.textContent='cargando…'; est.style.color='var(--dim)'; }
    fetch('/api/huecos-snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'semana', semana:_semActual})})
      .then(function(r){return r.json();}).then(function(res){
        if(!res||!res.ok){ if(est){ est.textContent='no se pudo cargar: '+((res&&res.error)||'error'); est.style.color='var(--rojo)'; } return; }
        _semData=res.filas||[]; renderSemana();
        if(est){ est.textContent=_semData.length+' concepto(s) registrados'; est.style.color='var(--verde)'; }
      }).catch(function(e){ if(est){ est.textContent='sin conexión al servidor (requiere Netlify)'; est.style.color='var(--rojo)'; } });
  }
  function renderSemana(){
    var filas=_semData||[];
    var th=0,tv=0,tc=0,tsku=0,tsim=0,tp=0;
    filas.forEach(function(f){ th+=f.hueco_piezas||0; tv+=Number(f.hueco_valor||0); tc+=f.cubierto_piezas||0; tsku+=f.cubierto_sku||0; tsim+=f.cubierto_similar||0; tp+=f.pendiente_piezas||0; });
    var pct=th>0?Math.round(Math.min(th,tc)/th*100):0;
    var res=document.getElementById('sem-resumen');
    if(res) res.innerHTML=
      '<div class="r"><span class="l">Conceptos</span><span class="v">'+num(filas.length)+'</span></div>'+
      '<div class="r rojo"><span class="l">Hueco total</span><span class="v" style="color:var(--rojo)">'+num(th)+'</span></div>'+
      '<div class="r dor"><span class="l">Hueco valorizado</span><span class="v">'+money(Math.round(tv))+'</span></div>'+
      '<div class="r ver"><span class="l">Cubierto</span><span class="v" style="color:var(--verde)">'+num(tc)+' ('+pct+'%)</span></div>'+
      '<div class="r"><span class="l">· mismo SKU</span><span class="v">'+num(tsku)+'</span></div>'+
      '<div class="r"><span class="l">· similares</span><span class="v" style="color:var(--morado)">'+num(tsim)+'</span></div>'+
      '<div class="r rojo"><span class="l">Pendiente</span><span class="v" style="color:var(--rojo)">'+num(tp)+'</span></div>';
    var cont=document.getElementById('sem-tabla');
    if(!filas.length){ cont.innerHTML='<div class="empty">No hay huecos registrados en esta semana. Abre un hueco en la pestaña «Huecos» y usa «Registrar en la semana».</div>'; return; }
    var body=filas.map(function(f){
      var cub=f.cubierto_piezas||0, hue=f.hueco_piezas||0, p=hue>0?Math.min(100,Math.round(Math.min(hue,cub)/hue*100)):0;
      return '<tr>'+
        '<td class="fxc fx1" style="font-weight:600" title="'+escH(f.concepto_label)+'">'+escH(f.concepto_label)+'</td>'+
        '<td class="num hk-neg" style="font-weight:700">'+num(hue)+'</td>'+
        '<td class="num" style="color:var(--dorado)">'+money(Math.round(Number(f.hueco_valor||0)))+'</td>'+
        '<td class="num" style="color:var(--verde);font-weight:600">'+num(cub)+'</td>'+
        '<td class="num">'+num(f.cubierto_sku||0)+'</td>'+
        '<td class="num" style="color:var(--morado)">'+num(f.cubierto_similar||0)+'</td>'+
        '<td class="num'+((f.pendiente_piezas||0)>0?' hk-neg':'')+'" style="font-weight:600">'+num(f.pendiente_piezas||0)+'</td>'+
        '<td class="num"><div class="sem-barra"><div class="sem-barra-in" style="width:'+p+'%"></div></div><span style="font-size:11px;color:var(--dim)">'+p+'%</span></td>'+
        '</tr>'; }).join('');
    var foot='<tr style="font-weight:700"><td class="fxc fx1">TOTAL</td>'+
      '<td class="num hk-neg">'+num(th)+'</td><td class="num">'+money(Math.round(tv))+'</td>'+
      '<td class="num" style="color:var(--verde)">'+num(tc)+'</td><td class="num">'+num(tsku)+'</td>'+
      '<td class="num" style="color:var(--morado)">'+num(tsim)+'</td><td class="num">'+num(tp)+'</td>'+
      '<td class="num">'+pct+'%</td></tr>';
    cont.innerHTML='<table><thead><tr>'+
      '<th class="fxc fx1">Concepto</th><th class="num">Hueco</th><th class="num">Valorizado</th><th class="num">Cubierto</th>'+
      '<th class="num" title="Cubierto con el mismo producto">Mismo SKU</th><th class="num" title="Cubierto con productos similares del concepto">Similares</th>'+
      '<th class="num">Pendiente</th><th class="num">Avance</th>'+
      '</tr></thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table>';
  }
  function exportarSemanaExcel(){
    var filas=_semData||[]; if(!filas.length){ alert('No hay datos de la semana para exportar.'); return; }
    var aoa=[['Semana','Concepto','Hueco (pzas)','Hueco valorizado','Cubierto','Mismo SKU','Similares','Pendiente','Avance %']];
    filas.forEach(function(f){ var hue=f.hueco_piezas||0, cub=f.cubierto_piezas||0, p=hue>0?Math.round(Math.min(hue,cub)/hue*100):0;
      aoa.push([_semActual, f.concepto_label, hue, Math.round(Number(f.hueco_valor||0)), cub, f.cubierto_sku||0, f.cubierto_similar||0, f.pendiente_piezas||0, p]); });
    if(!window.XLSX){ csvFallback(aoa); return; }
    var ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:10},{wch:34},{wch:11},{wch:15},{wch:10},{wch:10},{wch:10},{wch:10},{wch:9}];
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Semana '+_semActual);
    XLSX.writeFile(wb,'huecos_semana_'+_semActual+'.xlsx');
  }

  function initTabs(){
    document.querySelectorAll('.tab[data-tab]').forEach(function(t){
      t.addEventListener('click',function(){
        var tb=t.getAttribute('data-tab'); if(tb===TAB) return;
        TAB=tb; dropdownAbierto=null; sucDDAbierto=false; if(TAB!=='sku') skuLista=[];
        document.querySelectorAll('.tab[data-tab]').forEach(function(x){ x.classList.toggle('activo', x.getAttribute('data-tab')===TAB); });
        pintar();
      });
    });
  }
  window.cargarBI=function(){
    if(window.DATOS && window.DATOS.rows){ procesarJSON(window.DATOS); return; }
    if(window.DATOS_LZ && window.LZString){ try{ procesarJSON(JSON.parse(LZString.decompressFromBase64(window.DATOS_LZ))); return; }catch(e){ showError('No se pudieron descomprimir los datos: '+String(e)); return; } }
    if(location.protocol==='http:'||location.protocol==='https:'){ fetch('/api/inventario-data?token='+encodeURIComponent(TOKEN)).then(function(r){return r.json();}).then(function(res){
      if(res && res.lz && window.LZString){ try{ procesarJSON(JSON.parse(LZString.decompressFromBase64(res.lz))); }catch(e){ showError('No se pudieron descomprimir los datos: '+String(e)); } }
      else procesarJSON(res);
    }).catch(function(e){ showError('No se pudo contactar al servidor: '+String(e)); }); return; }
    showError('Este archivo no trae datos embebidos.');
  };
  window.addEventListener('DOMContentLoaded', cargarBI);
})();
</script>
